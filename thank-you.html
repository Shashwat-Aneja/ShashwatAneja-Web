<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Thank You | Shashwat Aneja</title>

  <meta
    name="description"
    content="A quiet thank-you page from Shashwat Aneja's developer portfolio."
  >
  <meta name="author" content="Shashwat Aneja">

  <!-- Confirmation pages should not be indexed -->
  <meta name="robots" content="noindex,follow">

  <meta name="theme-color" content="#0B0A0F">
  <meta name="color-scheme" content="dark light">

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/assets/icons/site.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shashwat Aneja">
  <meta property="og:title" content="Thank You | Shashwat Aneja">
  <meta
    property="og:description"
    content="Thank you for exploring Shashwat Aneja's portfolio."
  >
  <meta
    property="og:image"
    content="https://shashwataneja.com/assets/og/shashwat-aneja-portfolio.png"
  >

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Thank You | Shashwat Aneja">
  <meta
    name="twitter:description"
    content="Thank you for exploring Shashwat Aneja's portfolio."
  >
  <meta
    name="twitter:image"
    content="https://shashwataneja.com/assets/og/shashwat-aneja-portfolio.png"
  >

  <link rel="stylesheet" href="/css/field.css">

  <style>
    .thank-page {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
    }

    .thank-shell {
      min-height: 100svh;
      width: min(100% - 44px, 1320px);
      margin: 0 auto;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
      padding: 100px 0;
    }

    .thank-content {
      width: min(100%, 900px);
      text-align: center;
    }

    .thank-kicker {
      margin: 0 0 25px;
      color: var(--lavender);
      font: 9px/1.4 "IBM Plex Mono", monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .thank-title {
      margin: 0;
      color: var(--text-primary);
      font: 400 clamp(75px, 14vw, 180px)/.8 Georgia, "Times New Roman", serif;
      letter-spacing: -.075em;
    }

    .thank-message {
      max-width: 600px;
      margin: 35px auto 0;
      color: var(--text-secondary);
      font-size: clamp(15px, 1.4vw, 19px);
      line-height: 1.7;
    }

    .thank-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 38px;
      padding: 9px 13px;
      border: 1px solid var(--field-line);
      color: var(--text-muted);
      font: 8px/1 "IBM Plex Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .thank-status__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 10px color-mix(in srgb, var(--sage) 50%, transparent);
    }

    .thank-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 42px;
    }

    .thank-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--field-line);
      color: var(--text-primary);
      background: color-mix(in srgb, var(--card) 75%, transparent);
      text-decoration: none;
      font: 8px/1 "IBM Plex Mono", monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
      transition:
        transform .25s var(--ease),
        border-color .25s ease,
        background .25s ease,
        color .25s ease;
    }

    .thank-action:hover,
    .thank-action:focus-visible {
      transform: translateY(-3px);
      border-color: var(--lavender);
      background: color-mix(in srgb, var(--lavender) 8%, var(--card));
      color: var(--text-primary);
      outline: none;
    }

    .thank-action--primary {
      border-color: var(--line-strong);
      color: var(--lavender);
    }

    .thank-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 30px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--text-muted);
      font: 8px/1.4 "IBM Plex Mono", monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .thank-footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color .2s ease;
    }

    .thank-footer a:hover,
    .thank-footer a:focus-visible {
      color: var(--lavender);
      outline: none;
    }

    .thank-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .thank-background__circle {
      position: absolute;
      width: min(55vw, 700px);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--lavender) 9%, transparent);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .thank-background__circle:nth-child(2) {
      width: min(38vw, 480px);
      border-color: color-mix(in srgb, var(--sage) 8%, transparent);
    }

    .thank-background__circle:nth-child(3) {
      width: min(22vw, 280px);
      border-color: color-mix(in srgb, var(--ember) 9%, transparent);
    }

    @media (max-width: 600px) {
      .thank-shell {
        width: min(100% - 28px, 1320px);
        padding-bottom: 100px;
      }

      .thank-title {
        font-size: clamp(65px, 21vw, 110px);
      }

      .thank-message {
        font-size: 14px;
      }

      .thank-footer {
        position: absolute;
        bottom: 18px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .thank-background__circle {
        width: 95vw;
      }

      .thank-background__circle:nth-child(2) {
        width: 68vw;
      }

      .thank-background__circle:nth-child(3) {
        width: 42vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .thank-action {
        transition: none;
      }
    }
  </style>
</head>

<body class="thank-page">

  <div class="thank-background" aria-hidden="true">
    <div class="thank-background__circle"></div>
    <div class="thank-background__circle"></div>
    <div class="thank-background__circle"></div>
  </div>

  <!-- Resident robot -->
  <div
    class="guide-robot"
    data-guide-robot
    data-cursor="drag"
    role="img"
    aria-label="Guide robot. Drag me if I get in your way. Use the arrow keys when focused."
    tabindex="0"
  >
    <div class="guide-robot__antenna"></div>

    <div class="guide-robot__head">
      <span class="guide-robot__eye"></span>
      <span class="guide-robot__eye"></span>
    </div>

    <div class="guide-robot__neck"></div>

    <div class="guide-robot__body">
      <span class="guide-robot__panel"></span>
      <span class="guide-robot__indicator"></span>
    </div>

    <div class="guide-robot__arm guide-robot__arm--left"></div>
    <div class="guide-robot__arm guide-robot__arm--right"></div>

    <div class="guide-robot__hand guide-robot__hand--left"></div>
    <div class="guide-robot__hand guide-robot__hand--right"></div>

    <div class="guide-robot__leg guide-robot__leg--left"></div>
    <div class="guide-robot__leg guide-robot__leg--right"></div>

    <div class="guide-robot__foot guide-robot__foot--left"></div>
    <div class="guide-robot__foot guide-robot__foot--right"></div>

    <div class="guide-robot__signal"></div>
    <span class="guide-robot__label mono" data-guide-label>THANKS</span>
  </div>

  <div class="field-cursor" data-cursor aria-hidden="true">
    <small></small>
  </div>

  <main class="thank-shell">

    <section class="thank-content" aria-labelledby="thank-title">

      <p class="thank-kicker">MESSAGE / RECEIVED</p>

      <h1 class="thank-title" id="thank-title">
        Thank you.
      </h1>

      <p class="thank-message">
        Your message has reached the right place.
        Thanks for taking the time to explore the work, the experiments,
        and the ideas behind them.
      </p>

      <div class="thank-status">
        <span class="thank-status__dot" aria-hidden="true"></span>
        <span>TRANSMISSION COMPLETE</span>
      </div>

      <nav class="thank-actions" aria-label="Next actions">
        <a
          class="thank-action thank-action--primary"
          href="/"
        >
          Return to portfolio
        </a>

        <a
          class="thank-action"
          href="/projects/"
        >
          Explore projects
        </a>

        <a
          class="thank-action"
          href="mailto:hello@shashwataneja.com"
        >
          Send another message
        </a>
      </nav>

    </section>

    <footer class="thank-footer">
      <span>SHASHWAT ANEJA / 2026</span>

      <span>
        <a href="/privacy.html">Privacy</a>
        &nbsp;&nbsp;
        <a href="/terms.html">Terms</a>
      </span>
    </footer>

  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/experience.js"></script>

</body>
</html>

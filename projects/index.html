<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="index,follow"><meta name="description" content="Project archive from Shashwat Aneja, covering games, machine learning, algorithms, hardware, automation and experiments."><link rel="canonical" href="https://shashwataneja.com/projects/"><meta property="og:type" content="website"><meta property="og:site_name" content="Shashwat Aneja"><meta property="og:title" content="Project Archive | Shashwat Aneja"><meta property="og:description" content="A paginated archive of projects, experiments and systems built by Shashwat Aneja."><meta property="og:url" content="https://shashwataneja.com/projects/"><meta property="og:image" content="https://shashwataneja.com/assets/og/shashwat-aneja-portfolio.png"><meta name="twitter:card" content="summary_large_image"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/project-detail.css"><link rel="stylesheet" href="../css/variables.css"><title>Project Archive | Shashwat Aneja</title></head><body><header class="detail-nav"><a class="detail-nav__back" href="../">← Back to portfolio</a><span class="mono">PROJECT ARCHIVE</span></header><main class="detail-shell"><section class="detail-hero"><div><div class="mono">PROJECT ARCHIVE</div><h1>The work <em>behind</em> the highlights.</h1></div><div><p class="detail-deck">Eight projects per page. Filter the field, browse the trail, and open a repository when something catches your attention.</p></div></section><div class="archive-filter" data-archive-filter></div><div class="archive-grid" data-archive-grid></div><div class="archive-pager" data-archive-pager></div></main><style>
.archive-filter{display:flex;flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:55px}.archive-filter button{padding:12px 13px;border:0;border-right:1px solid var(--border);background:none;color:var(--text-muted);font:8px/1 "IBM Plex Mono",monospace;cursor:pointer}.archive-filter button:hover,.archive-filter button.is-active{color:var(--lavender);background:color-mix(in srgb,var(--lavender) 7%,transparent)}.archive-grid{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--border);margin-top:0}.archive-card{min-height:240px;padding:25px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--text-primary);display:flex;flex-direction:column;justify-content:space-between;transition:background .3s ease,transform .3s ease}.archive-card:hover{background:color-mix(in srgb,var(--lavender) 5%,transparent)}.archive-card__main{display:flex;flex-direction:column;justify-content:space-between;flex:1;color:inherit;text-decoration:none}.archive-card__top{display:flex;justify-content:space-between;color:var(--text-muted);font:8px/1 "IBM Plex Mono",monospace}.archive-card h2{font:400 clamp(27px,3vw,45px)/.95 Georgia,serif;letter-spacing:-.035em;margin:35px 0 10px}.archive-card p{margin:0;max-width:560px;color:var(--text-secondary);font:13px/1.55 Georgia,serif}.archive-card__foot{display:flex;justify-content:space-between;gap:15px;margin-top:30px;color:var(--lavender);font:8px/1.4 "IBM Plex Mono",monospace}.archive-pager{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding:14px 0;margin-bottom:80px}.archive-pager__pages{display:flex;gap:4px}.archive-pager button{min-width:32px;height:32px;border:1px solid transparent;background:none;color:var(--text-muted);font:8px/1 "IBM Plex Mono",monospace;cursor:pointer}.archive-pager button:hover,.archive-pager button.is-active{border-color:var(--border);color:var(--text-primary)}.archive-pager button.is-active{border-color:var(--lavender);color:var(--lavender)}.archive-pager__status{color:var(--text-muted);font-size:8px}@media(max-width:700px){.archive-grid{grid-template-columns:1fr}.archive-filter{overflow:auto;flex-wrap:nowrap}.archive-filter button{white-space:nowrap}.archive-card{min-height:220px;padding:20px}.archive-pager__status{display:none}}
</style><script src="../js/projects-data.js"></script><script src="../js/theme.js"></script><script>
(()=>{const projects=window.PORTFOLIO_PROJECTS||[];const filter=document.querySelector('[data-archive-filter]');const grid=document.querySelector('[data-archive-grid]');const pager=document.querySelector('[data-archive-pager]');const tabs=['ALL','AI / ML','DATA','SOFTWARE','GAMES','VR / 3D','HARDWARE','AUTOMATION','EXPERIMENTS','ARCHIVE'];const perPage=8;let active='ALL',page=1;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const visible=()=>active==='ALL'?projects:projects.filter(p=>(p.categories||[]).includes(active));function draw(){const all=visible(),pages=Math.max(1,Math.ceil(all.length/perPage));page=Math.min(Math.max(1,page),pages);const start=(page-1)*perPage;const deepDiveSlugs=new Set(['ARC-Asian-Royal-Conquest','Mnist-Digit-Classifier','sorting-visualizer','VR-Cricket','Xylo-business-automation-suite']);const repo=p=>`https://github.com/Shashwat-Aneja/${encodeURIComponent(p.slug)}`;grid.innerHTML=all.slice(start,start+perPage).map((p,i)=>{const hasDeepDive=deepDiveSlugs.has(p.slug);const href=hasDeepDive?`../projects/${esc(p.slug)}/`:repo(p);return `<article class="archive-card"><a class="archive-card__main" href="${href}"${hasDeepDive?'':' target="_blank" rel="noopener noreferrer"'}><div class="archive-card__top"><span>${String(start+i+1).padStart(2,'0')} / ${esc(p.type)}</span><span>${esc(p.icon||'·')}</span></div><div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p></div></a><div class="archive-card__foot"><span>${esc((p.categories||[]).join(' / '))}</span><span>${hasDeepDive?'DEEP DIVE ↗':'REPOSITORY ↗'}</span></div></article>`}).join('');pager.innerHTML=`<button data-prev ${page===1?'disabled':''}>←</button><div class="archive-pager__pages">${Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'is-active':''}" data-page="${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><span class="archive-pager__status mono">PAGE ${String(page).padStart(2,'0')} / ${String(pages).padStart(2,'0')}</span><button data-next ${page===pages?'disabled':''}>→</button>`}filter.innerHTML=tabs.map((t,i)=>`<button class="${i===0?'is-active':''}" data-filter="${esc(t)}">${esc(t)} <sup>${t==='ALL'?projects.length:projects.filter(p=>(p.categories||[]).includes(t)).length}</sup></button>`).join('');filter.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;active=b.dataset.filter;page=1;filter.querySelectorAll('button').forEach(x=>x.classList.toggle('is-active',x===b));draw()});pager.addEventListener('click',e=>{if(e.target.closest('[data-prev]'))page--;if(e.target.closest('[data-next]'))page++;const b=e.target.closest('[data-page]');if(b)page=Number(b.dataset.page);draw()});draw()})();</script></body></html>

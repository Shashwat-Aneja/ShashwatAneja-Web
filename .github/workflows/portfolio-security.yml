name: Portfolio security checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify HTML security and disclosure controls
        run: python3 scripts/verify_security.py
      - name: Check extracted archive JavaScript syntax
        run: node --check js/project-archive.js

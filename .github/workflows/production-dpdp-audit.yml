name: Production DPDP and security audit

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  live-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public site and DNS (read-only)
        run: python3 scripts/audit_live_site.py
      - name: Read GitHub Pages configuration (no changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GitHub Pages configuration:"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url, cname, https_enforced, status, source}' || echo "Pages API unavailable or repository is not configured as a Pages site."
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-security-audit
          path: production-security-audit.json
          if-no-files-found: warn
